services:
  postgres:
    image: postgres:17-alpine
    container_name: warecore-db
    environment:
      POSTGRES_DB: warecore
      POSTGRES_USER: warecore_user
      POSTGRES_PASSWORD: warecore_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: